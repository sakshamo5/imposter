workflows:
  android-release:
    name: Android Release (AAB)
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
      vars:
        PACKAGE_NAME: "com.example.imposter"
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Configure Android signing from Codemagic variables
        script: |
          if [ -n "$CM_KEYSTORE_PATH" ] && [ -n "$CM_KEYSTORE_PASSWORD" ] && [ -n "$CM_KEY_ALIAS" ] && [ -n "$CM_KEY_PASSWORD" ] && [ -f "$CM_KEYSTORE_PATH" ]; then
            cat > "$CM_BUILD_DIR/android/key.properties" <<EOF
            storePassword=$CM_KEYSTORE_PASSWORD
            keyPassword=$CM_KEY_PASSWORD
            keyAlias=$CM_KEY_ALIAS
            storeFile=$CM_KEYSTORE_PATH
            EOF
          elif [ -n "$CM_KEYSTORE_PATH" ] && [ -n "$CM_KEYSTORE_PASSWORD" ] && [ -n "$CM_KEY_ALIAS" ] && [ -n "$CM_KEY_PASSWORD" ]; then
            echo "Android signing variables are set, but keystore file was not found at: $CM_KEYSTORE_PATH"
            exit 1
          else
            echo "Android signing variables are not fully set; build will use debug signing."
          fi
      - name: Static analysis
        script: flutter analyze
      - name: Run tests
        script: flutter test
      - name: Build Android App Bundle
        script: flutter build appbundle --release
    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - $FCI_BUILD_INITIATOR
